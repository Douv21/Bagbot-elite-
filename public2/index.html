<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BagBot Elite - Dashboard 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>BagBot Elite</h2>
                <button id="closeSidebar" class="mobile-only">&times;</button>
            </div>
            <nav class="sidebar-nav">
                <a href="#" data-section="general" class="nav-item active">🏠 Général</a>
                <a href="#" data-section="moderation" class="nav-item">🛡️ Modération</a>
                <a href="#" data-section="economy" class="nav-item">⭐ Économie & Niveaux</a>
                <a href="#" data-section="autoroles" class="nav-item">🎭 Auto-Rôles</a>
                <a href="#" data-section="entertainment" class="nav-item">🎮 Divertissement</a>
                <a href="#" data-section="ai" class="nav-item">🤖 IA & Support</a>
                <a href="#" data-section="community" class="nav-item">🌟 Communauté</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="top-header">
                <button id="openSidebar" class="mobile-only">☰</button>
                <div class="header-left">
                    <span id="botInfo">Chargement...</span>
                </div>
                <div class="header-right">
                    <select id="guildSelector">
                        <option value="">Sélectionnez un serveur</option>
                    </select>
                    <div class="user-profile" id="userProfile">
                        <span id="userName">Invité</span>
                        <button id="logoutBtn" class="btn-gold-outline">Déconnexion</button>
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <div class="content-area" id="contentArea">
                <!-- Sections will be injected here by app.js -->
                <div id="general" class="section active">
                    <h1>Général</h1>
                    <div class="panel">
                        <h2>Arrivées & Départs</h2>
                        <p>Configurez les messages de bienvenue et d'au revoir.</p>
                        <!-- Formulaires fictifs pour la structure -->
                        <div class="form-group">
                            <label>Salon de bienvenue</label>
                            <select id="welcomeChannel"></select>
                        </div>
                        <button class="btn-gold" onclick="saveConfig('general')">Sauvegarder</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="app.js"></script>
</body>
</html>
